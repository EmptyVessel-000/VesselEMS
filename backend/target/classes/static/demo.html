<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Worklist · 任务追踪器</title>
    <script src="vue.js"></script>
    <script src="element-plus.js"></script>
    <link rel="stylesheet" href="element-plus.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
        }

        .task-title {
            font-size: 1.1em !important;
        }

        .task-desc {
            font-size: 0.9em !important;
        }

        .el-table {
            --el-table-header-text-color: #333;
        }

        .task-card {
            padding: 12px 16px !important;
            border-radius: 16px !important;
            border: none !important;
            height: 100px !important;
            display: flex !important;
            flex-direction: column !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
            color: #ffffff !important;
        }

        .task-card .task-title,
        .task-card .task-desc {
            color: #ffffff !important;
        }
    </style>
</head>

<body>
    <!-- 用 Vue 管理整个页面 -->
    <div id="app">
        <div class="app-layout">
            <!-- 左侧边栏 -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>📋 Worklist</h2>
                    <p>团队任务追踪 · 原型版</p>
                </div>
                <div class="nav-menu">
                    <div class="nav-item" :class="{ active: currentPage === 'tasks' }" @click="switchPage('tasks')">
                        <span class="nav-icon">📌</span>
                        <span>任务列表</span>
                    </div>
                    <div class="nav-item" :class="{ active: currentPage === 'settings' }"
                        @click="switchPage('settings')">
                        <span class="nav-icon">⚙️</span>
                        <span>设置</span>
                    </div>
                </div>
                <div class="sidebar-footer">
                    <div>面板设计示意</div>
                    <div style="font-size: 11px; margin-top: 8px;">后续扩展：团队 / 标签 / 筛选</div>
                </div>
            </aside>

            <!-- 右侧主内容 -->
            <main class="main-content">
                <!-- 任务列表页 -->
                <div v-show="currentPage === 'tasks'" class="content-panel">
                    <div class="panel-header">
                        <h1>📋 任务追踪列表</h1>
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                            <p>拖动滑块调整任务完成状态 (1 → 5)</p>
                            <el-switch v-model="showCompleted" active-text="显示已完成" inactive-text="仅看未完成" />
                        </div>
                    </div>
                    <div class="task-list-container">
                        <el-table :data="filteredTasks" style="width: 100%"
                            :default-sort="{prop: 'createdAt', order: 'descending'}">
                            <el-table-column prop="createdAt" label="创建时间" width="100" sortable>
                                <template #default="scope">
                                    <div>{{ new Date(scope.row.createdAt).toLocaleDateString() }}</div>
                                </template>
                            </el-table-column>
                            <el-table-column label="任务信息" width="240">
                                <template #default="scope">
                                    <div class="task-card"
                                        :style="{ background: scope.row.status === 5 ? '#28a745' : (scope.row.status === 4 ? '#20c997' : (scope.row.status === 3 ? '#ffc107' : (scope.row.status === 2 ? '#3b82f6' : '#94a3b8'))) }">
                                        <div class="task-title">{{ scope.row.name }}</div>
                                        <div class="task-desc" style="opacity: 0.9;">{{ scope.row.description || '无详细描述'
                                            }}</div>
                                    </div>
                                </template>
                            </el-table-column>
                            <el-table-column prop="status" label="完成程度" width="320" sortable>
                                <template #default="scope">
                                    <div
                                        style="display: flex; flex-direction: column; justify-content: space-between; height: 100px;">
                                        <div style="font-size: 14px; color: #666; font-weight: 500;">{{
                                            getStatusText(scope.row.status) }}</div>
                                        <input type="range" min="1" max="5" step="1" v-model.number="scope.row.status"
                                            @change="updateStatus(scope.row, scope.row.status)" class="task-slider">
                                    </div>
                                </template>
                            </el-table-column>
                            <el-table-column prop="endTime" label="截止时间" sortable>
                                <template #default="scope">
                                    <div v-if="hasValidEndTime(scope.row.endTime)"
                                        :class="['remaining-time', { overdue: isOverdue(scope.row.endTime) }]">
                                        {{ formatRemaining(scope.row.endTime) }}
                                    </div>
                                    <div v-else class="remaining-time">–</div>
                                </template>
                            </el-table-column>
                            <el-table-column label="操作">
                                <template #default="scope">
                                    <el-button type="danger" size="small" @click="requestDeleteTask(scope.row.id)">🗑️
                                        删除</el-button>
                                </template>
                            </el-table-column>
                        </el-table>
                    </div>
                    <div style="padding: 18px 28px 24px; border-top: 1px solid #eff3f8;">
                        <button @click="openModal" class="btn-primary">➕ 新建任务</button>
                        <span style="margin-left: 16px; font-size: 13px; color: #6c7a91;">点击添加新任务</span>
                    </div>
                </div>

                <!-- 设置页 -->
                <div v-show="currentPage === 'settings'" class="content-panel">
                    <div class="panel-header">
                        <h1>⚙️ 设置</h1>
                        <p>团队与个人偏好配置（预留）</p>
                    </div>
                    <div class="settings-placeholder">
                        <h3>🔧 尚未实现具体内容</h3>
                        <p>此处将来可配置：主题、提醒、用户信息、数据同步等。</p>
                    </div>
                </div>
            </main>
        </div>

        <!-- 弹窗 -->
        <div class="modal" v-show="showModal">
            <div class="modal-content">
                <h3>新建任务</h3>

                <label>任务名称：</label>
                <input type="text" v-model="newTask.name" placeholder="">

                <label>任务介绍：</label>
                <textarea v-model="newTask.description" rows="3" placeholder=""></textarea>

                <label>开始时间：</label>
                <div class="datetime-group">
                    <input type="date" v-model="newTask.startDate" placeholder="2026-03-28">
                    <input type="time" v-model="newTask.startTime" placeholder="14:30">
                </div>

                <label>结束时间：</label>
                <div class="datetime-group">
                    <input type="date" v-model="newTask.endDate" placeholder="2026-04-05">
                    <input type="time" v-model="newTask.endTime" placeholder="17:00">
                </div>

                <div class="modal-buttons">
                    <button @click="saveTask">保存</button>
                    <button @click="closeModal">取消</button>
                </div>
            </div>
        </div>

        <!-- 删除确认弹窗 -->
        <div class="modal" v-show="showDeleteModal">
            <div class="modal-content">
                <h3>确认删除任务</h3>
                <p>确定要删除该任务吗？此操作无法撤销。</p>
                <div class="modal-buttons">
                    <button @click="deleteTask">确认删除</button>
                    <button @click="closeDeleteModal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;
        const app = createApp({
            setup() {
                // 切换页面
                function switchPage(page) {
                    currentPage.value = page;
                }

                // 任务列表数据（预览时默认示例数据）
                const previewTasks = [
                    {
                        id: -1,
                        name: '示例任务：写需求文档',
                        description: '仅用于界面预览，接入API后优先显示后台内容',
                        status: 2,
                        startTime: '2026-03-29T09:00:00',
                        endTime: '2026-03-30T18:00:00'
                    },
                    {
                        id: -2,
                        name: '示例任务：代码评审',
                        description: '仅用于界面预览，接入API后优先显示后台内容',
                        status: 3,
                        startTime: '2026-03-30T10:00:00',
                        endTime: '2026-03-31T10:00:00'
                    }
                ];

                const tasks = ref(previewTasks.slice());

                // 获取任务列表
                async function loadTasks() {
                    try {
                        const res = await fetch('/api/tesk');
                        if (!res.ok) throw new Error('加载失败');
                        const remote = await res.json();
                        if (Array.isArray(remote) && remote.length > 0) {
                            tasks.value = remote;
                        } else {
                            // 后端无数据时仍保持示例，用于本地预览体验
                            tasks.value = previewTasks.slice();
                        }
                    } catch (err) {
                        console.error('加载任务失败:', err);
                        tasks.value = previewTasks.slice();
                    }
                }

                // 状态文字映射
                function getStatusText(status) {
                    const map = {
                        1: '⚪ 未开始',
                        2: '🔵 初步',
                        3: '🟡 进行中',
                        4: '🟢 接近完成',
                        5: '✅ 已完成'
                    };
                    return map[status] || '进行中';
                }

                function normalizeDateTime(dateStr) {
                    if (!dateStr) return null;
                    const d = new Date(dateStr);
                    if (Number.isNaN(d.getTime())) return null;
                    return d.toISOString().replace('Z', '').substring(0, 19);
                }

                function isOverdue(endTime) {
                    if (!endTime) return false;
                    const d = new Date(endTime);
                    if (Number.isNaN(d.getTime())) return false;
                    return d.getTime() < Date.now();
                }

                function hasValidEndTime(endTime) {
                    if (!endTime) return false;
                    const d = new Date(endTime);
                    return !Number.isNaN(d.getTime());
                }

                function formatRemaining(endTime) {
                    if (!endTime) return null;
                    const d = new Date(endTime);
                    if (Number.isNaN(d.getTime())) return null;
                    const now = Date.now();
                    let diff = d.getTime() - now;
                    if (diff <= 0) return '已超期';

                    const day = 24 * 60 * 60 * 1000;
                    const hour = 60 * 60 * 1000;
                    const minute = 60 * 1000;

                    if (diff >= day) {
                        const days = Math.floor(diff / day);
                        return `${days} 天`;
                    }

                    const hours = Math.floor(diff / hour);
                    diff -= hours * hour;
                    const minutes = Math.floor(diff / minute);

                    if (hours === 0 && minutes === 0) return '不足 1 分钟';
                    if (hours === 0) return `${minutes} 分钟`;
                    return `${hours} 小时 ${minutes} 分钟`;
                }


                // 页面状态
                const currentPage = ref('tasks');
                const showModal = ref(false);
                const showCompleted = ref(true);

                // 过滤列表
                const filteredTasks = Vue.computed(() => {
                    if (showCompleted.value) return tasks.value;
                    return tasks.value.filter(t => t.status < 5);
                });

                // 新任务表单
                const newTask = ref({
                    name: '',
                    description: '',
                    startDate: '',
                    startTime: '',
                    endDate: '',
                    endTime: ''
                });

                // 打开弹窗
                function openModal() {
                    newTask.value = { name: '', description: '', startDate: '', startTime: '', endDate: '', endTime: '' };
                    showModal.value = true;
                }

                // 关闭弹窗
                function closeModal() {
                    showModal.value = false;
                }

                // 更新任务状态
                async function updateStatus(task, newStatus) {
                    try {
                        const res = await fetch(`/api/tesk/${task.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: task.name,
                                description: task.description || null,
                                startTime: task.startTime || null,
                                endTime: task.endTime || null,
                                status: parseInt(newStatus)
                            })
                        });

                        if (!res.ok) throw new Error('更新失败');

                        task.status = parseInt(newStatus);
                    } catch (err) {
                        console.error('更新状态失败:', err);
                        alert('更新失败，请重试');
                    }
                }

                // 删除确认状态与任务ID
                const showDeleteModal = ref(false);
                const deleteCandidate = ref(null);

                function requestDeleteTask(taskId) {
                    deleteCandidate.value = taskId;
                    showDeleteModal.value = true;
                }

                function closeDeleteModal() {
                    showDeleteModal.value = false;
                    deleteCandidate.value = null;
                }

                async function deleteTask() {
                    const id = deleteCandidate.value;
                    if (!id) {
                        closeDeleteModal();
                        return;
                    }

                    closeDeleteModal();

                    try {
                        const res = await fetch(`/api/tesk/${id}`, {
                            method: 'DELETE'
                        });

                        if (!res.ok) {
                            throw new Error('删除失败');
                        }

                        alert('删除成功');
                        await loadTasks();
                    } catch (err) {
                        console.error('删除任务失败:', err);
                        alert('删除失败，请重试');
                        // 无后端时本地模式删除逻辑
                        tasks.value = tasks.value.filter(task => task.id !== id);
                    }
                }

                // 保存任务后刷新列表
                async function saveTask() {
                    if (!newTask.value.name) {
                        alert('请输入任务名称');
                        return;
                    }

                    try {
                        // 组合日期和时间
                        const buildDateTime = (date, time) => {
                            if (!date || !time) return null;
                            return normalizeDateTime(date + 'T' + time);
                        };

                        const startTime = buildDateTime(newTask.value.startDate, newTask.value.startTime);
                        const endTime = buildDateTime(newTask.value.endDate, newTask.value.endTime);

                        console.log('表单原始值:', {
                            startDate: newTask.value.startDate,
                            startTime: newTask.value.startTime,
                            endDate: newTask.value.endDate,
                            endTime: newTask.value.endTime
                        });
                        console.log('组合后的值:', {
                            startTime: startTime,
                            endTime: endTime
                        });

                        const res = await fetch('/api/tesk', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: newTask.value.name,
                                description: newTask.value.description || null,
                                startTime: startTime,
                                endTime: endTime,
                                status: 1
                            })
                        });

                        if (!res.ok) {
                            const errMsg = await res.text();
                            throw new Error(errMsg);
                        }

                        const result = await res.json();
                        console.log('服务器响应:', result);

                        closeModal();
                        alert('创建成功');
                        await loadTasks();

                    } catch (err) {
                        console.error(err);
                        alert('创建失败: ' + err.message);
                    }
                }

                // 页面加载时获取任务
                loadTasks();

                return {
                    switchPage: switchPage,
                    tasks: tasks,
                    filteredTasks: filteredTasks,
                    showCompleted: showCompleted,
                    loadTasks: loadTasks,
                    getStatusText: getStatusText,
                    formatRemaining: formatRemaining,
                    isOverdue: isOverdue,
                    hasValidEndTime: hasValidEndTime,
                    currentPage: currentPage,
                    showModal: showModal,
                    showDeleteModal: showDeleteModal,
                    newTask: newTask,
                    openModal: openModal,
                    closeModal: closeModal,
                    saveTask: saveTask,
                    updateStatus: updateStatus,
                    requestDeleteTask: requestDeleteTask,
                    closeDeleteModal: closeDeleteModal,
                    deleteTask: deleteTask
                };
            }
        });

        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>

</html>
