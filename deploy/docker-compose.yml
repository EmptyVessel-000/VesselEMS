version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vesselems-db
    environment:
      POSTGRES_DB: vessel_ems
      POSTGRES_USER: vessel_user
      POSTGRES_PASSWORD: Vessel127
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vessel_user -d vessel_ems"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vesselems-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vessel_ems
      SPRING_DATASOURCE_USERNAME: vessel_user
      SPRING_DATASOURCE_PASSWORD: Vessel127
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: vesselems-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata: